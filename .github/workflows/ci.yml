name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-lib:
    name: Library tests
    # Prefer Linux for free-tier runners; core/ai/agent --lib has no Tauri/wake deps.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # Workspace root; skip large/unneeded targets when possible
          workspaces: ". -> target"

      - name: Test core agent plane
        run: cargo test -p boris-core -p boris-ai -p boris-agent --lib
