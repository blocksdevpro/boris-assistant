name: Build macOS bundle

on:
  # Run on demand so macOS runner time is used only when a release candidate
  # needs to be checked.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    name: Build Boris for macOS
    runs-on: macos-14
    env:
      # Lets the test artifact run on Apple Silicon without requiring an Apple
      # Developer certificate. This is not a notarized release signature.
      APPLE_SIGNING_IDENTITY: "-"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build ad-hoc-signed macOS bundle
        working-directory: desktop
        run: bun run tauri build

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: Boris-macos
          path: |
            target/release/bundle/macos/Boris.app
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
