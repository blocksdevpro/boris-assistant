name: Release quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-quality:
    name: Windows build, test, and desktop quality gates
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Lint release-critical Rust crates
        run: cargo clippy -p boris-core -p boris-ai -p boris-agent --lib -- -D warnings

      - name: Run release-critical Rust tests
        run: cargo test -p boris-core -p boris-ai -p boris-agent --lib --locked

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Build desktop frontend
        working-directory: desktop
        run: bun run build

      - name: Test desktop frontend
        working-directory: desktop
        run: bun run test

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Audit Rust dependency advisories
        uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Audit production frontend dependencies
        working-directory: desktop
        run: npm audit --package-lock-only --omit=dev --audit-level=high
