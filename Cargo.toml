[workspace]
resolver = "2"
members = [
    "crates/boris-core",
    "crates/boris-audio",
    "crates/boris-inference",
    "crates/boris-agent",
    "crates/boris-stt-parakeet",
    "crates/boris-tts-kokoro",
    "crates/boris-tts-supertone",
]

[workspace.dependencies]
tracing           = "0.1"
serde_json        = "1"
crossbeam-channel = "0.5"
thiserror         = "2"
boris-core        = { path = "crates/boris-core" }
boris-audio       = { path = "crates/boris-audio" }
boris-inference   = { path = "crates/boris-inference" }

# ── Binary ────────────────────────────────────────────────────────────────────

[package]
name    = "boris-assistant"
version = "0.1.0"
edition = "2021"

[dependencies]
boris-core         = { workspace = true }
boris-audio        = { workspace = true }
boris-inference    = { workspace = true }
boris-agent        = { path = "crates/boris-agent" }
boris-stt-parakeet = { path = "crates/boris-stt-parakeet" }
boris-tts-kokoro   = { path = "crates/boris-tts-kokoro" }
boris-tts-supertone   = { path = "crates/boris-tts-supertone" }


hound              = "3.5"
tracing            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
crossbeam-channel  = { workspace = true }
serde_json         = { workspace = true }
dotenvy            = "0.15"
