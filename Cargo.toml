[workspace]
resolver = "2"
members = [
    "crates/boris-core",
    "crates/boris-audio",
    "crates/boris-sense",
    "crates/boris-inference",
    "crates/boris-ai",
    "crates/boris-agent",
    "crates/boris-stt-parakeet",
    "crates/boris-tts-kokoro",
    "crates/boris-tts-supertone",
    "crates/boris-pipeline",
    "desktop/src-tauri",
    "xtask",
]

[workspace.package]
# `rust-toolchain.toml` pins the release compiler; this is the supported MSRV.
rust-version = "1.97"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/blocksdevpro/boris-assistant"

[workspace.dependencies]
tracing           = "0.1"
serde_json        = "1"
crossbeam-channel = "0.5"
thiserror         = "2"
# Version pinned once here; consuming crates add their own `features` on top
# via `{ workspace = true, features = [...] }` to avoid independent drift.
reqwest           = { version = "0.13", default-features = true }
tokio             = "1"
async-trait       = "0.1"
boris-core        = { path = "crates/boris-core" }
boris-sense       = { path = "crates/boris-sense" }
boris-audio       = { path = "crates/boris-audio" }
boris-inference   = { path = "crates/boris-inference" }
boris-ai          = { path = "crates/boris-ai" }
boris-agent       = { path = "crates/boris-agent" }
boris-pipeline    = { path = "crates/boris-pipeline" }

# Root package is intentionally not a voice host. Product entrypoint: boris-desktop.
[package]
name         = "boris-assistant"
version      = "1.1.0-beta.4"
edition      = "2021"
rust-version = "1.97"
description  = "Boris Assistant workspace (retired CLI stub; product host is boris-desktop)"
license      = "Apache-2.0"
readme       = "README.md"
repository   = "https://github.com/blocksdevpro/boris-assistant"
publish      = false

[[bin]]
name = "boris-assistant"
path = "src/main.rs"

[dependencies]
