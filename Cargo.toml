[workspace]
resolver = "2"
members = [
    "crates/boris-core",
    "crates/boris-audio",
    "crates/boris-sense",
    "crates/boris-inference",
    "crates/boris-ai",
    "crates/boris-agent",
    "crates/boris-stt-parakeet",
    "crates/boris-tts-kokoro",
    "crates/boris-tts-supertone",
    "crates/boris-pipeline",
    "desktop/src-tauri",
]

[workspace.dependencies]
tracing           = "0.1"
serde_json        = "1"
crossbeam-channel = "0.5"
thiserror         = "2"
boris-core        = { path = "crates/boris-core" }
boris-sense       = { path = "crates/boris-sense" }
boris-audio       = { path = "crates/boris-audio" }
boris-inference   = { path = "crates/boris-inference" }
boris-ai          = { path = "crates/boris-ai" }
boris-pipeline    = { path = "crates/boris-pipeline" }

# Root package is intentionally not a voice host. Product entrypoint: boris-desktop.
[package]
name    = "boris-assistant"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "boris-assistant"
path = "src/main.rs"

[dependencies]
