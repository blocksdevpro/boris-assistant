[package]
name    = "boris-agent"
version = "0.1.0"
edition = "2021"
description = "Voice-aware agent harness: loop, tools, runtime, memory, sessions"

[dependencies]
boris-ai   = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }

serde       = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = "0.1"
reqwest     = { version = "0.13", default-features = true, features = ["json"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
tokio-util  = { version = "0.7", default-features = false, features = [] }
open        = "5"
arboard     = "3"
htmd        = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "fs"] }
