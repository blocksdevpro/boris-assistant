[package]
name        = "boris-agent"
version     = "1.0.0"
edition     = "2021"
rust-version.workspace = true
description = "Voice-aware agent harness: loop, tools, runtime, memory, sessions"
license     = "Apache-2.0"
repository  = "https://github.com/blocksdevpro/boris-assistant"
readme      = "README.md"
publish     = false
keywords    = ["agent", "tools", "assistant"]
categories  = ["asynchronous"]

[dependencies]
boris-ai   = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }

serde       = { version = "1", features = ["derive"] }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = { workspace = true }
futures     = { version = "0.3", default-features = false, features = ["std", "async-await", "alloc"] }
reqwest     = { workspace = true, features = ["json"] }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
tokio-util  = { version = "0.7", default-features = false, features = ["rt"] }
open        = "5"
arboard     = "3"
htmd        = "0.1"
rusqlite    = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "fs"] }
