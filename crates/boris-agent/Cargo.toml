[package]
name        = "boris-agent"
version     = "1.0.0"
edition     = "2021"
rust-version.workspace = true
description = "Voice-aware agent harness: loop, tools, runtime, memory, sessions"
license     = "Apache-2.0"
repository  = "https://github.com/blocksdevpro/boris-assistant"
readme      = "README.md"
publish     = false
keywords    = ["agent", "tools", "assistant"]
categories  = ["asynchronous"]

[dependencies]
boris-ai   = { workspace = true }
serde_json = { workspace = true }
tracing    = { workspace = true }

serde       = { version = "1", features = ["derive"] }
regex       = "1"
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
async-trait = { workspace = true }
futures     = { version = "0.3", default-features = false, features = ["std", "async-await", "alloc"] }
reqwest     = { workspace = true, features = ["json"] }
tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs", "process", "io-util"] }
tokio-util  = { version = "0.7", default-features = false, features = ["rt"] }
open        = "5"
arboard     = "3"
htmd        = "0.1"
rusqlite    = { version = "0.32", features = ["bundled"] }
# Already in the tree via arboard (png only); used to downscale/encode images.
image       = { version = "0.25", default-features = false, features = ["png"] }
base64      = "0.22"

[target.'cfg(windows)'.dependencies]
# GDI screen capture for screen_capture (bindings only; already in the tree).
# Job Objects: background bash jobs die with their whole process tree.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "fs"] }
