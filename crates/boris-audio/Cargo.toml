[package]
name        = "boris-audio"
version     = "0.1.0"
edition     = "2021"
license     = "Apache-2.0"
repository  = "https://github.com/blocksdevpro/boris-assistant"
description = "Real-time duplex audio I/O for Boris (cpal capture/playback + rubato resample)"
readme      = "README.md"
publish     = false
keywords    = ["audio", "cpal", "voice"]
categories  = ["multimedia::audio"]

[dependencies]
boris-core        = { workspace = true }
tracing           = { workspace = true }
crossbeam-channel = { workspace = true }
cpal   = "0.18"
rubato = "3.0"
