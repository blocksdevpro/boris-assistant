[package]
name        = "boris-stt-parakeet"
version     = "0.1.0"
edition     = "2021"
description = "Parakeet ONNX SpeechToText adapter for Boris (transcribe-rs)"
publish     = false
readme      = "README.md"
license = "Apache-2.0"

repository = "https://github.com/blocksdevpro/boris-assistant"
[dependencies]
boris-core      = { workspace = true }
boris-inference = { workspace = true }
tracing         = { workspace = true }

transcribe-rs = { version = "0.3.11", features = ["onnx"] }
