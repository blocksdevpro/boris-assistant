[package]
name              = "boris-tts-kokoro"
version           = "0.1.0"
edition.workspace = true
description       = "Kokoro (any-tts) TextToSpeech adapter for Boris — experimental"
publish           = false
readme            = "README.md"
license.workspace = true
repository.workspace = true

[dependencies]
boris-core      = { workspace = true }
boris-inference = { workspace = true }
tracing         = { workspace = true }

# Kokoro only; no HuggingFace auto-download — hosts must supply local weights.
any-tts = { version = "0.1.2", default-features = false, features = ["kokoro"] }
