[package]
name        = "boris-tts-supertone"
version     = "0.1.0"
edition     = "2021"
description = "Supertone / Supertonic TextToSpeech adapter for Boris (st-tts)"
publish     = false
readme      = "README.md"
license = "Apache-2.0"

repository = "https://github.com/blocksdevpro/boris-assistant"
[dependencies]
boris-core      = { workspace = true }
boris-inference = { workspace = true }
tracing         = { workspace = true }

st-tts     = "0.3"
serde_json = { workspace = true }
tokio      = { version = "1", features = ["rt-multi-thread"] }

[[example]]
name = "smoke_synth"
path = "examples/smoke_synth.rs"
