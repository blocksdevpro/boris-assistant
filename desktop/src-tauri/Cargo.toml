[package]
name = "boris-desktop"
version = "0.1.0"
description = "Boris Desktop — voice assistant shell"
authors = ["you"]
edition = "2021"

[lib]
name = "boris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
boris-pipeline = { workspace = true }
boris-tts-supertone = { path = "../../crates/boris-tts-supertone" }
