[package]
name        = "boris-desktop"
version     = "1.1.0-beta.4"
description = "Boris — voice assistant"
default-run = "boris"
authors     = ["BlocksDevPro"]
edition     = "2021"
rust-version.workspace = true
license     = "Apache-2.0"
repository  = "https://github.com/blocksdevpro/boris-assistant"
readme      = "../../README.md"
publish     = false

[lib]
name = "boris_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "boris"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
boris-pipeline = { workspace = true }
boris-tts-supertone = { path = "../../crates/boris-tts-supertone" }
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
url = "2"
reqwest = { workspace = true }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
